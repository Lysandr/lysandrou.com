<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#070a0f"/>
  <!-- z-axis up -->
  <line x1="16" y1="18" x2="16" y2="5" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="square"/>
  <polyline points="13,9 16,5 19,9" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linejoin="miter"/>
  <!-- x-axis right -->
  <line x1="16" y1="18" x2="28" y2="18" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="square"/>
  <polyline points="24,15 28,18 24,21" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linejoin="miter"/>
  <!-- y-axis lower-left (isometric) -->
  <line x1="16" y1="18" x2="6" y2="27" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="square"/>
  <polyline points="6,22 6,27 11,27" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linejoin="miter"/>
</svg>
