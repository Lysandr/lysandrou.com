<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,212,255,0.05)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-left" cx="25%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#050810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="80%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050810" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#050810"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow-left)"/>
  <rect width="800" height="450" fill="url(#glow-right)"/>

  <!-- Ambient particles -->
  <circle cx="70"  cy="60"  r="1.5" fill="#00d4ff" opacity="0.5"/>
  <circle cx="180" cy="30"  r="1"   fill="#00ff88" opacity="0.6"/>
  <circle cx="600" cy="50"  r="2"   fill="#00d4ff" opacity="0.35"/>
  <circle cx="730" cy="130" r="1.5" fill="#00ff88" opacity="0.4"/>
  <circle cx="760" cy="380" r="1"   fill="#00d4ff" opacity="0.4"/>
  <circle cx="40"  cy="340" r="2"   fill="#00d4ff" opacity="0.3"/>

  <!-- ── Telemetry panel (left) ─────────────────────────────── -->
  <rect x="50" y="55" width="310" height="310" rx="4"
        fill="rgba(255,255,255,0.03)" stroke="rgba(0,212,255,0.18)" stroke-width="1"/>
  <!-- header -->
  <rect x="50" y="55" width="310" height="40" rx="4" fill="rgba(0,212,255,0.07)"/>
  <rect x="50" y="75"  width="310" height="20" fill="rgba(0,212,255,0.07)"/>
  <text x="70" y="81" font-family="'Space Mono', monospace" font-size="12" fill="#00d4ff" opacity="0.9">// telemetry</text>
  <!-- live dot -->
  <circle cx="335" cy="75" r="4" fill="#00ff88" opacity="0.85"/>

  <!-- column headers -->
  <text x="70"  y="115" font-family="'Space Mono', monospace" font-size="9" fill="rgba(0,212,255,0.4)" letter-spacing="0.08em">KEY</text>
  <text x="230" y="115" font-family="'Space Mono', monospace" font-size="9" fill="rgba(0,212,255,0.4)" letter-spacing="0.08em">VALUE</text>
  <line x1="50" y1="120" x2="360" y2="120" stroke="rgba(0,212,255,0.1)" stroke-width="1"/>

  <!-- telemetry rows -->
  <text x="70"  y="140" font-family="'Space Mono', monospace" font-size="10" fill="rgba(140,200,220,0.55)">alt_f32</text>
  <text x="230" y="140" font-family="'Space Mono', monospace" font-size="10" fill="rgba(200,235,255,0.85)">142.37</text>

  <text x="70"  y="160" font-family="'Space Mono', monospace" font-size="10" fill="rgba(140,200,220,0.55)">vel_z_f32</text>
  <text x="230" y="160" font-family="'Space Mono', monospace" font-size="10" fill="#00ff88" opacity="0.9">-2.14</text>

  <text x="70"  y="180" font-family="'Space Mono', monospace" font-size="10" fill="rgba(140,200,220,0.55)">thr_cmd_f32</text>
  <text x="230" y="180" font-family="'Space Mono', monospace" font-size="10" fill="rgba(200,235,255,0.85)">0.612</text>

  <text x="70"  y="200" font-family="'Space Mono', monospace" font-size="10" fill="rgba(140,200,220,0.55)">att_q_v3f</text>
  <text x="230" y="200" font-family="'Space Mono', monospace" font-size="10" fill="rgba(200,235,255,0.85)">0.01, -0.03, 0.99</text>

  <text x="70"  y="220" font-family="'Space Mono', monospace" font-size="10" fill="rgba(140,200,220,0.55)">p_rate_f32</text>
  <text x="230" y="220" font-family="'Space Mono', monospace" font-size="10" fill="rgba(200,235,255,0.85)">0.003</text>

  <text x="70"  y="240" font-family="'Space Mono', monospace" font-size="10" fill="rgba(140,200,220,0.55)">eng_state_i32</text>
  <text x="230" y="240" font-family="'Space Mono', monospace" font-size="10" fill="#00ff88" opacity="0.9">2</text>

  <text x="70"  y="260" font-family="'Space Mono', monospace" font-size="10" fill="rgba(140,200,220,0.55)">fuel_pct_f32</text>
  <text x="230" y="260" font-family="'Space Mono', monospace" font-size="10" fill="rgba(200,235,255,0.85)">78.4</text>

  <text x="70"  y="280" font-family="'Space Mono', monospace" font-size="10" fill="rgba(140,200,220,0.55)">accel_v3f</text>
  <text x="230" y="280" font-family="'Space Mono', monospace" font-size="10" fill="rgba(200,235,255,0.85)">0.12, 0.04, 9.71</text>

  <text x="70"  y="300" font-family="'Space Mono', monospace" font-size="10" fill="rgba(140,200,220,0.55)">loop_hz_f32</text>
  <text x="230" y="300" font-family="'Space Mono', monospace" font-size="10" fill="rgba(200,235,255,0.85)">100.0</text>

  <text x="70"  y="320" font-family="'Space Mono', monospace" font-size="10" fill="rgba(140,200,220,0.55)">mode_s</text>
  <text x="230" y="320" font-family="'Space Mono', monospace" font-size="10" fill="#00d4ff" opacity="0.85">DESCENT</text>

  <!-- ── Time-series chart panel (right) ───────────────────── -->
  <rect x="390" y="55" width="360" height="190" rx="4"
        fill="rgba(255,255,255,0.03)" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>
  <rect x="390" y="55" width="360" height="36" rx="4" fill="rgba(0,212,255,0.05)"/>
  <rect x="390" y="71"  width="360" height="20" fill="rgba(0,212,255,0.05)"/>
  <text x="408" y="79" font-family="'Space Mono', monospace" font-size="11" fill="#00d4ff" opacity="0.75">vel_z_f32  — time series</text>

  <!-- chart axes -->
  <line x1="415" y1="105" x2="415" y2="228" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <line x1="415" y1="228" x2="735" y2="228" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>

  <!-- y-axis labels -->
  <text x="400" y="110" font-family="'Space Mono', monospace" font-size="8" fill="rgba(0,212,255,0.35)" text-anchor="end">2</text>
  <text x="400" y="145" font-family="'Space Mono', monospace" font-size="8" fill="rgba(0,212,255,0.35)" text-anchor="end">0</text>
  <text x="400" y="192" font-family="'Space Mono', monospace" font-size="8" fill="rgba(0,212,255,0.35)" text-anchor="end">-4</text>
  <text x="400" y="228" font-family="'Space Mono', monospace" font-size="8" fill="rgba(0,212,255,0.35)" text-anchor="end">-8</text>

  <!-- zero line -->
  <line x1="415" y1="145" x2="735" y2="145" stroke="rgba(0,212,255,0.07)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- time-series line: velocity during descent — starts near 0, dips, recovers slightly -->
  <polyline
    points="418,143 435,141 452,138 469,132 486,124 503,116 520,120 537,127 554,133 571,138 588,136 605,130 622,122 639,116 656,118 673,124 690,129 707,132 724,134 734,134"
    fill="none" stroke="#00ff88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- fill under line -->
  <polygon
    points="418,143 435,141 452,138 469,132 486,124 503,116 520,120 537,127 554,133 571,138 588,136 605,130 622,122 639,116 656,118 673,124 690,129 707,132 724,134 734,134 734,228 418,228"
    fill="rgba(0,255,136,0.05)"/>

  <!-- ── 3D scatter panel (right-lower) ────────────────────── -->
  <rect x="390" y="265" width="175" height="130" rx="4"
        fill="rgba(255,255,255,0.03)" stroke="rgba(0,212,255,0.12)" stroke-width="1"/>
  <rect x="390" y="265" width="175" height="30" rx="4" fill="rgba(0,212,255,0.04)"/>
  <rect x="390" y="280" width="175" height="15" fill="rgba(0,212,255,0.04)"/>
  <text x="406" y="285" font-family="'Space Mono', monospace" font-size="10" fill="#00d4ff" opacity="0.6">att_q_v3f  scatter</text>

  <!-- 3D scatter dots — simulating attitude vector scatter -->
  <circle cx="450" cy="340" r="2"   fill="#00d4ff" opacity="0.5"/>
  <circle cx="470" cy="325" r="1.5" fill="#00d4ff" opacity="0.6"/>
  <circle cx="490" cy="350" r="2"   fill="#00d4ff" opacity="0.4"/>
  <circle cx="510" cy="320" r="1.5" fill="#00d4ff" opacity="0.55"/>
  <circle cx="435" cy="355" r="1"   fill="#00d4ff" opacity="0.45"/>
  <circle cx="455" cy="310" r="2.5" fill="#00d4ff" opacity="0.35"/>
  <circle cx="480" cy="360" r="1.5" fill="#00ff88" opacity="0.4"/>
  <circle cx="500" cy="335" r="2"   fill="#00d4ff" opacity="0.5"/>
  <circle cx="525" cy="345" r="1"   fill="#00d4ff" opacity="0.45"/>
  <circle cx="445" cy="370" r="1.5" fill="#00d4ff" opacity="0.3"/>
  <circle cx="515" cy="310" r="2"   fill="#00ff88" opacity="0.35"/>
  <circle cx="460" cy="380" r="1"   fill="#00d4ff" opacity="0.4"/>

  <!-- ── Architecture pipeline ─────────────────────────────── -->
  <rect x="575" y="265" width="175" height="130" rx="4"
        fill="rgba(255,255,255,0.03)" stroke="rgba(0,212,255,0.12)" stroke-width="1"/>
  <rect x="575" y="265" width="175" height="30" rx="4" fill="rgba(0,212,255,0.04)"/>
  <rect x="575" y="280" width="175" height="15" fill="rgba(0,212,255,0.04)"/>
  <text x="591" y="285" font-family="'Space Mono', monospace" font-size="10" fill="#00d4ff" opacity="0.6">// architecture</text>

  <!-- pipeline boxes -->
  <rect x="591" y="308" width="52" height="22" rx="2" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.25)" stroke-width="1"/>
  <text x="617" y="323" font-family="'Space Mono', monospace" font-size="8" fill="#00d4ff" text-anchor="middle">FSW</text>

  <rect x="663" y="308" width="52" height="22" rx="2" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.25)" stroke-width="1"/>
  <text x="689" y="323" font-family="'Space Mono', monospace" font-size="8" fill="#00d4ff" text-anchor="middle">Flask</text>

  <rect x="627" y="352" width="52" height="22" rx="2" fill="rgba(0,255,136,0.08)" stroke="rgba(0,255,136,0.25)" stroke-width="1"/>
  <text x="653" y="367" font-family="'Space Mono', monospace" font-size="8" fill="#00ff88" text-anchor="middle">React</text>

  <!-- arrows -->
  <line x1="643" y1="319" x2="663" y2="319" stroke="rgba(0,212,255,0.4)" stroke-width="1"/>
  <polyline points="661,316 663,319 661,322" fill="none" stroke="rgba(0,212,255,0.4)" stroke-width="1"/>

  <line x1="689" y1="330" x2="689" y2="342" stroke="rgba(0,212,255,0.3)" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="689" y1="342" x2="653" y2="352" stroke="rgba(0,212,255,0.3)" stroke-width="1" stroke-dasharray="3,2"/>
  <polyline points="655,349 653,352 656,354" fill="none" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>

  <text x="591" y="388" font-family="'Space Mono', monospace" font-size="8" fill="rgba(0,212,255,0.3)">UDP:6000 · WS · REST</text>

  <!-- ── Status bar ─────────────────────────────────────────── -->
  <rect x="50" y="385" width="700" height="28" rx="3" fill="rgba(0,212,255,0.04)" stroke="rgba(0,212,255,0.1)" stroke-width="1"/>
  <circle cx="70" cy="399" r="4" fill="#00ff88" opacity="0.85"/>
  <text x="82" y="403" font-family="'Space Mono', monospace" font-size="9" fill="rgba(200,235,255,0.45)">FSW CONNECTED</text>
  <text x="220" y="403" font-family="'Space Mono', monospace" font-size="9" fill="rgba(0,212,255,0.3)">·</text>
  <text x="232" y="403" font-family="'Space Mono', monospace" font-size="9" fill="rgba(200,235,255,0.45)">100 Hz</text>
  <text x="295" y="403" font-family="'Space Mono', monospace" font-size="9" fill="rgba(0,212,255,0.3)">·</text>
  <text x="307" y="403" font-family="'Space Mono', monospace" font-size="9" fill="rgba(200,235,255,0.45)">10 channels active</text>
  <text x="650" y="403" font-family="'Space Mono', monospace" font-size="9" fill="rgba(0,212,255,0.35)">UDP:6000 → :5000 → :3000</text>

  <!-- ── Logotype ────────────────────────────────────────────── -->
  <text x="420" y="52" font-family="'Space Mono', monospace" font-weight="700" font-size="38"
        fill="none" stroke="rgba(0,212,255,0.1)" stroke-width="1.5" letter-spacing="-1">nexus</text>
  <text x="420" y="52" font-family="'Space Mono', monospace" font-weight="700" font-size="38"
        fill="rgba(0,212,255,0.15)" letter-spacing="-1">nexus</text>
</svg>
